[project]
name = "hermes-factory"
version = "0.1.0"
description = "Autonomous software project factory driven by locally hosted models"
requires-python = ">=3.10"
# None, on purpose. Hermes runs on the standard library; the model server it
# talks to (vLLM) lives in an environment of its own. See README "Dependencies".
dependencies = []

[project.scripts]
hermes = "hermes.cli:main"
hpf = "hermes.cli:hpf"

# The build backend is in this repository too, so `pip install .` downloads
# nothing: no setuptools, no wheel package.
[build-system]
requires = []
build-backend = "hermes_backend"
backend-path = ["build_backend"]
