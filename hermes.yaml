# Hermes Project Factory configuration. Local models only.
models:
  default:
    backend: ollama
    base_url: http://localhost:11434
    model: qwen3:30b-a3b
    context: 32768
    temperature: 0.2
    timeout: 1200
    structured_output: true
    keep_alive: 30m

routing:
  research: default
  architecture: default
  coding: default
  review: default
  simple: default
  evolution: default

sandbox:
  runtime: docker
  image: python:3.11-slim
  network: none
  memory: 8g
  cpus: 4
  timeout: 900

research:
  enabled: true
  max_rounds: 3

execution:
  candidates: 1
  edit_protocol: true
  prefetch: true

evolution:
  enabled: true
  max_generations: 20
  population: 3
  baseline_repeats: 3

github:
  enabled: false
  private: true
