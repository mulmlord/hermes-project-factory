[project]
name = "hermes-factory"
version = "0.1.0"
description = "Autonomous software project factory driven by locally hosted models"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0"]

[project.scripts]
hermes = "hermes.cli:main"
hpf = "hermes.cli:hpf"

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["hermes*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
