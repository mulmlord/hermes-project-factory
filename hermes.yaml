# Hermes Project Factory configuration. Local models only.
models:
  default:
    backend: vllm
    base_url: http://localhost:6767/v1
    model: qwen2.5-coder-7b-instruct-awq
    # Must match the server's --max-model-len: every prompt budget in the
    # factory is derived from it, and a value larger than the server's is
    # discovered as a refused request.
    context: 16384
    temperature: 0.2
    timeout: 1200
    structured_output: true

routing:
  research: default
  architecture: default
  coding: default
  review: default
  simple: default
  evolution: default

server:
  autostart: true
  unit: hermes-vllm.service
  wait: 600
  stop_after_run: true

sandbox:
  runtime: docker
  image: python:3.11-slim
  network: none
  memory: 8g
  cpus: 4
  timeout: 900

research:
  enabled: true
  max_rounds: 3

execution:
  candidates: 1
  files: 6
  escalation:                      # how attempt 2, 3, ... are asked differently
    - {candidates: 2, files: 10}   # race more samples, show more of the code
    - {role: architect,            # then ask the reasoning role, on the same
       format: whole}              # model -- a rung never reloads weights --
                                   # and for whole files rather than patches,
                                   # for the files the last attempt failed on
  edit_protocol: true
  prefetch: true
  tool_calls: 6
  tool_rounds: 3

evolution:
  enabled: true
  max_generations: 20
  population: 3
  baseline_repeats: 3

security:
  classifier:                      # a second opinion on the security gate,
    enabled: false                 # advisory unless you set block: true
    base_url: http://localhost:6768  # contrib/laya_server.py serves this
    threshold: 0.75
    block: false
github:
  enabled: false
  private: true
