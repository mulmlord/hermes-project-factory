# Hermes Project Factory configuration. Local models only.
models:
  default:
    backend: vllm
    base_url: http://localhost:6767/v1
    model: qwen2.5-coder-7b-instruct-awq
    context: 16384
    temperature: 0.2
    timeout: 1200
    structured_output: true

routing:
  research: default
  architecture: default
  coding: default
  review: default
  simple: default
  evolution: default

server:
  autostart: true
  unit: hermes-vllm.service
  wait: 600
  stop_after_run: true

sandbox:
  runtime: docker
  image: python:3.11-slim
  network: none
  memory: 8g
  cpus: 4
  timeout: 900

research:
  enabled: true
  max_rounds: 3

execution:
  candidates: 1
  edit_protocol: true
  prefetch: true

evolution:
  enabled: true
  max_generations: 20
  population: 3
  baseline_repeats: 3

github:
  enabled: false
  private: true
